# Java kurulum adımını v4 olarak güncelleyin
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Android SDK kurulum adımı
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ... (Derleme adımlarınız: cmake --build vb.) ...

      # Derlenen .so kütüphanelerini çıktı olarak kaydetme
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Torque2D-Android-Libs
          path: |
            **/libTorque2D.so
            build/**/*.so
