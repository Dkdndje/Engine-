name: Torque2D Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # GitHub Arayüzünden manuel başlatma butonu ekler

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Depodaki kodları çek
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Alt modüller varsa onları da indirir

      # 2. JDK 17 Ortamını Kur
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Android SDK & NDK Ortamını Hazırla
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      # 4. Derleme için C++ ve CMake araçlarını yükle
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      # 5. Torque2D'yi CMake ve NDK ile Derle (ARM64)
      - name: Configure and Build with CMake
        run: |
          mkdir build_android
          cd build_android
          cmake .. \
            -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          ninja

      # 6. Oluşan APK'yı GitHub Artifacts olarak indirmeye hazırla
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Torque2D-Game-APK
          path: |
            build_android/**/*.apk
            **/*.apk
          if-no-files-found: warn
